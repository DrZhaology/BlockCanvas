# BlockCanvas · electron-builder 打包配置
# 目标：产出一个「绿色便携文件夹版」——解压即用、不装进 AppData；
#       extensions/ 统一在 data/extensions/（运行时），exe 旁不再保留。
# 运行：pnpm build && pnpm exec electron-builder --win dir
# 产物：dist\win-unpacked\（可运行的应用文件夹），随后压缩成 zip。

appId: com.blockcanvas.app
productName: BlockCanvas
copyright: Copyright © 2026 Dr.Zhaology

directories:
  output: dist
  buildResources: build

# 直接使用本地已解压的 Electron 运行时（node_modules/electron/dist），
# 跳过 electron-builder 的远程下载/缓存解析（本环境该步会报 cache 类型错误）。
electronDist: node_modules/electron/dist

# 只打包构建产物 + 入口 package.json 进 asar（程序本体）；
# extensions/ 已迁移至 data/extensions/，不再打包进 zip。
# 源码 / 文档 / 测试 / 依赖目录 / 构建资源 均不进包。
files:
  - out/**
  - package.json
  - '!node_modules/**'
  - '!src/**'
  - '!docs/**'
  - '!tests/**'
  - '!tools/**'
  - '!build/**'
  - '!dist/**'
  - '!data/**'

asar: true

# 窗口/任务栏图标：把三色 Logo 复制到 resources/icon.png。
# build/** 不进 asar，主进程在打包态从 resources 读它（见 main.ts createWindow）。
extraResources:
  - from: build/icon.png
    to: icon.png
  # v0.4.5：内置插件/资源包随包分发到这里，首次启动由主进程种进 data/extensions/。
  # 运行时**只有** data/extensions/ 一个扩展目录（仓库根的 extensions/ 已改名为 builtin-extensions/）。
  - from: builtin-extensions
    to: builtin-extensions

win:
  # 用 build/icon.png（256×256）自动生成 exe 图标
  icon: build/icon.png
  target:
    - target: dir
      arch:
        - x64
